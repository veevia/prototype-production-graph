      - {type: artifact, key: content, description: "The content document validates against its schema"}
      - {type: tool, fn: "content:check", description: "Datasets exist and parse; volume meets the plan; provenance is labelled in the UI; every source id is known and every verified field is in the data; every edge case appears in the data; no placeholder text"}
    evaluation: [content]
    failure_conditions: ["Placeholder text in the build", "Synthetic data without a visible label", "A planned edge case missing from the data", "Too few records"]
    retry: {max_attempts: 3, behavior: "Re-dispatch with the failing content checks"}
    escalation: {after: "3 consecutive failed attempts", to: Wei, report: "Which content cannot be made realistic without a real source, and who could supply it"}
    human_review: {required: false, decision: "Reviewed at N13–N14"}
    provenance: ["Dataset seed and generator recorded", "The integrated build's tree hash becomes build version N", "history.versions entry"]
    controls: {read: [prototype, research], write: []}

  # ------------------------------------------------------------------------------------------------------ validation
  - id: n13_quality_review
