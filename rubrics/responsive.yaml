id: responsive
name: Responsive behaviour
reviewer: technical-qa
scale: "tool dimensions pass/fail; review dimensions 1–5"
dimensions:
  - {id: RESP-OVERFLOW, name: "No horizontal overflow at planned viewports", brief_dimension: "responsive behavior", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "no page scroll wider than the viewport, in the document or in a region around the view that scrolls sideways (an app's main area), on every screen at every planned viewport", rule: R-A11Y-004, cases: {never: [], always: []}}
  - {id: RESP-REFLOW-320, name: "Content reflows at 320 CSS px", brief_dimension: "responsive behavior", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "no page-level horizontal scroll at 320 px, in the document or in a region around the view, on each screen's route and on its sampled records (WCAG 2.2 SC 1.4.10; data tables may scroll inside their own region)", rule: R-A11Y-004, cases: {never: [], always: []}}
  - {id: RESP-BAND, name: "No page overflow anywhere between the planned widths", brief_dimension: "responsive behavior", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "no page scroll wider than the viewport (the document, or a region around the view) on every screen, on its route and its sampled records, at up to 5 widths from one step above the reflow width to the narrowest planned width, then every band_step_px (20) to the widest (80 widths at most), each flagged width confirmed on a fresh load; the band also covers a 110 % zoom of every planned width but the narrowest. At the phone widths (the band up to the narrowest planned width, and the reflow width) also with each select's longest option chosen, and any disclosure that hides a select opened, one at a time", rule: R-A11Y-004, cases: {never: ["a layout that overflows only between two breakpoints"], always: []}}
  - {id: RESP-TEXT, name: "Text stays whole and inside its box at every width", brief_dimension: "responsive behavior", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "across the same band and records: no word of 6+ letters broken across lines without a hyphen, no boxed element (a background, a shadow or a border) whose text runs past its box, no select that cuts its value or would cut an option a user can pick, and nothing 1.4.12 text spacing breaks at a planned width that was whole without it; at the phone widths, none of these added by a select's longest value chosen or a disclosure opened", rule: R-VIS-006, cases: {never: ["contaminants split mid-word in a tile", "a tag running past its tile"], always: []}}
  - {id: RESP-LAYOUT, name: "Layouts adapt, not just shrink", brief_dimension: "responsive behavior", level: SHOULD, check: {type: review}, threshold: "score ≥ 4", rule: R-VIS-006, cases: {never: ["a desktop table squeezed to 6 px columns"], always: ["rows restacked as labelled fields on mobile"]}}
