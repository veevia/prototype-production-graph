id: prototype-plan
name: Prototype plan and fidelity gate
reviewer: prototype-developer
scale: "tool dimensions pass/fail; human dimensions decided by a named human"
dimensions:
  - {id: PLN-FIDELITY-GATE, name: "Fidelity follows validated assumptions and customer alignment", brief_dimension: "technical feasibility", level: MUST, check: {type: tool, fn: "plan:check"}, threshold: "mid/high fidelity: every riskiest assumption validated or accepted as a risk by a named human; high fidelity: customer alignment with evidence", rule: R-FID-001, cases: {never: ["a high-fidelity build on an untested core assumption"], always: ["a low-fidelity probe first"]}}
  - {id: PLN-SCENARIOS, name: "Every P0 flow has an executable scenario", brief_dimension: "workflow completeness", level: MUST, check: {type: tool, fn: "plan:check"}, threshold: "100% of P0 flows; every scenario ends in an expectation; each P0 scenario checks `expect_reachable` (within one screen of where the user is) or `expect_in_viewport` on the control its last click presses, before pressing it", rule: R-VAL-002, cases: {never: [], always: []}}
  - {id: PLN-STATES, name: "Empty and error states are planned for every data screen", brief_dimension: "interaction and state behavior", level: MUST, check: {type: tool, fn: "plan:check"}, threshold: "100% of data screens; every planned empty state has a `recover` way back", rule: R-UX-002, cases: {never: ["an empty state whose way back is a button with no handler"], always: ["recover: {click: '#clear-filters'}"]}}
  - {id: PLN-FOCUS, name: "Every N08 focus rule is checked", brief_dimension: "accessibility", level: MUST, check: {type: tool, fn: "plan:check"}, threshold: "100% of N08 focus rules traced once each: to an `expect_focus` step, to a browser focus check (A11Y-FOCUS, A11Y-FOCUS-VISIBLE-2411) for a rule about the focus indicator, or to a stated out-of-scope reason", rule: R-A11Y-003, cases: {never: ["a focus rule that no scenario or check exercises"], always: []}}
  - {id: PLN-ACCEPTANCE, name: "Every P0 acceptance line is checked", brief_dimension: "requirement coverage", level: MUST, check: {type: tool, fn: "plan:check"}, threshold: "100% of P0 acceptance lines traced once each to an expectation step, a `forbidden_text` entry, a check a later node runs (`covered_by`), or a stated out-of-scope reason; untraced P1 lines are listed", rule: R-SCP-007, cases: {never: ["a naming rule no step or forbidden text checks"], always: ["{requirement: R-08, acceptance: 'The rail uses the four names', forbidden_text: 'Change Ledger'}"]}}
  - {id: PLN-SAMPLES, name: "Every record screen names its worst-case records", brief_dimension: "responsive behavior", level: SHOULD, check: {type: tool, fn: "plan:check"}, threshold: "every screen of kind `record` names ≥ min_samples (2) other records in `samples`, the ones most likely to break the layout (the most actions or pills, the longest title, a missing field); the width checks load them", rule: R-A11Y-004, cases: {never: ["one record sampled, while a third head action overflowed 17 of 31 records at 320 px"], always: []}}
  - {id: PLN-VIEWPORTS, name: "Viewports span mobile to desktop", brief_dimension: "responsive behavior", level: MUST, check: {type: tool, fn: "plan:check"}, threshold: "≥ 3 viewports incl. one ≤ 400 px and one ≥ 1280 px", rule: R-A11Y-004, cases: {never: [], always: []}}
  - {id: PLN-APPROVED, name: "Wei approved the fidelity and plan", brief_dimension: "technical feasibility", level: MUST, check: {type: human}, threshold: "a named human approved at N10", rule: R-GOV-003, cases: {never: [], always: []}}
