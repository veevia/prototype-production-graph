      - {key: validation_review, kind: json, schema: review, description: "Scored review dimensions and findings"}
      - {key: research_md, kind: control, doc: research, description: "your copy of research.md, installed into controls/research.md — validation findings appended"}
    completion:
      - {type: artifact, key: validation, description: "The validation document validates against its schema"}
      - {type: tool, fn: "validation:check", description: "Every task maps to a planned scenario; success rate, time and SEQ are computed; simulated sessions are flagged"}
      - {type: review_complete, key: validation_review, description: "Every MUST review dimension is scored"}
    evaluation: [validation]
    failure_conditions: ["A task on an unknown scenario", "A session without the simulated flag", "A MUST review dimension left unscored"]
    retry: {max_attempts: 2, behavior: "Re-dispatch with the failing validation checks"}
    escalation: {after: "2 consecutive failed attempts", to: Wei, report: "Which sessions could not be run, and whom to recruit"}
    human_review: {required: false, decision: "Real-user validation is a human dimension, confirmed by Wei at N18"}
    provenance: ["Sessions per build version; simulated input flagged", "research.md validation findings are append-only"]
    controls: {read: [research, evaluation], write: [research], sections: {research: [Validation findings]}}
    run: {tool: "validation:prepare"}

