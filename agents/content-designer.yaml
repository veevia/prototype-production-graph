# Content Designer — responsibilities and bindings. `leads`/`supports` must match graph/workflow.yaml (checked by `pdg docs --check`).
id: content-designer
name: Content Designer
responsibility: Writes the copy deck in the users' vocabulary and produces realistic, seeded, labelled datasets that exercise
  every planned edge case, then integrates them into the build under review.
leads:
- n12_content_data — Content and realistic data integration
supports: []
available_context:
- The plan's content needs and scenarios
- Evidence of the domain's own terms
- Earlier programmes' synthetic-data practice (seeded, invariants, provenance classes)
inputs:
- artifact:prototype_build
- artifact:plan
outputs:
- prototype
- content
skills:
- content-writing
- content-designer
- terminology-taxonomy-designer
- asset-collection
tools:
- seeded synthetic-data generator
- the prototype build script
- pdg.tools.content:check
decision_authority: Owns copy and data realism; never presents invented data as real.
quality_criteria:
- content
constraints:
- No lorem ipsum, TODO or TBD
- Synthetic data carries a visible label
- Missing values are shown as missing, never zero
escalation:
  when: Realistic content needs a real source that nobody has supplied
  to: Wei
  how: Retry budget → escalation naming the source needed
runtime_binding: built-in:general-purpose
