id: visual-system
name: Visual and design system
reviewer: visual-design-system
scale: "tool dimensions pass/fail; human dimensions decided by a named human"
dimensions:
  - {id: VIS-CONTRAST, name: "Every declared colour pair meets WCAG contrast", brief_dimension: "accessibility", level: MUST, check: {type: tool, fn: "design_system:check"}, threshold: "text ≥ 4.5:1; large text and non-text UI ≥ 3:1 (WCAG 2.2 SC 1.4.3, 1.4.11)", rule: R-A11Y-002, cases: {never: [], always: []}}
  - {id: VIS-RATIO-STATED, name: "Every contrast ratio design.md states is what the tokens give", brief_dimension: "visual quality and consistency", level: SHOULD, check: {type: tool, fn: "design_system:check"}, threshold: "every ratio in a design.md table column headed Ratio or Contrast, for two known opaque tokens, equals the measured ratio cut or rounded to its decimals, never rounded up across a WCAG step (4.5, 3)", rule: R-VIS-002, cases: {never: ["4.48:1 stated as 4.5:1"], always: []}}
  - {id: VIS-TYPE, name: "One type scale: ≤ 8 sizes, none below 12 px", brief_dimension: "visual quality and consistency", level: MUST, check: {type: tool, fn: "design_system:check"}, threshold: "≤ 8 sizes; min ≥ 12 px (calibration pending: an earlier programme used 11 px labels)", rule: R-VIS-001, cases: {never: [], always: []}}
  - {id: VIS-RADII, name: "One radius set: ≤ 5 radii", brief_dimension: "visual quality and consistency", level: SHOULD, check: {type: tool, fn: "design_system:check"}, threshold: "≤ 5 radii", rule: R-VIS-001, cases: {never: [], always: []}}
  - {id: VIS-SPACING, name: "Spacing on one 4 px scale", brief_dimension: "visual quality and consistency", level: SHOULD, check: {type: tool, fn: "design_system:check"}, threshold: "every spacing step is a multiple of 4 px", rule: R-VIS-003, cases: {never: [], always: []}}
  - {id: VIS-PROVENANCE, name: "Every token carries provenance", brief_dimension: "visual quality and consistency", level: MUST, check: {type: tool, fn: "design_system:check"}, threshold: "100% of colour tokens name their source", rule: R-VIS-002, cases: {never: ["a hex value picked by eye"], always: ["'brand guide p.4' or 'derived: 8% tint of accent'"]}}
  - {id: VIS-PROHIBITED, name: "Prohibited patterns are named", brief_dimension: "visual quality and consistency", level: MUST, check: {type: tool, fn: "design_system:check"}, threshold: "≥ 1 prohibited pattern", rule: R-VIS-004, cases: {never: [], always: ["'no gradients', 'status never by colour alone'"]}}
  - {id: VIS-ALERT-RESERVED, name: "The alert colour is reserved for alerts", brief_dimension: "visual quality and consistency", level: MUST, check: {type: tool, fn: "design_system:check"}, threshold: "the alert role appears on no non-alert token", rule: R-VIS-005, cases: {never: ["brand red on a routine button"], always: []}}
  - {id: VIS-APPROVED, name: "Wei approved the visual system", brief_dimension: "visual quality and consistency", level: MUST, check: {type: human}, threshold: "a named human approved at N09", rule: R-GOV-003, cases: {never: [], always: []}}
