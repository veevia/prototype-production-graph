    lifecycle_step: Content and realistic data integration
    phase: Build
    stage: Prototype
    subgraph: prototype
    kind: agent
    purpose: Replace seed data with realistic, labelled, reproducible content — datasets that exercise the planned edge cases and a copy deck in the users' vocabulary — and integrate them into the prototype build under review.
    depends_on: [n11_prototype_development]
    inputs: ["artifact:prototype_build", "artifact:plan", "state:build.plan", "state:design.screens", "state:research.evidence", "control:prototype", "control:research", "rework:self"]
    context: ["“The prototype is too generic” → product-specific, realistic content and meaningful workflows", "Synthetic or invented data is labelled at the point of decision; missing data is shown as missing, never as zero", "Seeded generators make data reproducible"]
    state_read: [build.plan, design.screens, research.evidence]
    state_write: [build.prototype, build.version, build.content_artifacts]
    agent: content-designer
    skills: [content-writing, content-designer, terminology-taxonomy-designer, asset-collection, evidence-tagging]
    tools: ["seeded synthetic-data generator", "python build script", "pdg.tools.content:check"]
    instructions: >-
      Generate or curate datasets with a seed and a provenance (real | synthetic | invented | mixed: invented records whose
      `verified_fields` were checked against the named `source_ids`). Cover every edge case the
      plan's scenarios need (for example out-of-range, missing and borderline values) and name them in `edge_cases`. Write the
      copy deck in the users' own vocabulary. Show a visible label in the UI when data is synthetic. Integrate the data and
