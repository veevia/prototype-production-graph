# Accessibility Reviewer — responsibilities and bindings. `leads`/`supports` must match graph/workflow.yaml (checked by `pdg docs --check`).
id: accessibility-reviewer
name: Accessibility Reviewer
responsibility: Judges what automated checks cannot — names, headings, landmarks, reading order, meaningful status text —
  and confirms contrast and focus decisions in the visual system.
leads: []
supports:
- n09_visual_system — Visual and design-system definition
- n13_quality_review — Functional, design, and accessibility review
available_context:
- browser-report.json axe results and screenshots
- WCAG 2.2 A/AA; axe finds roughly 57% of issues automatically
- accessibility-verification skill
inputs:
- artifact:browser_report
- artifact:screenshots
outputs:
- A11Y-SEMANTICS score inside quality_review
skills:
- accessibility-verification
- browser-testing-with-devtools
tools:
- axe-core (vendored)
- Chrome DevTools MCP (lighthouse_audit, snapshots)
decision_authority: Scores accessibility judgement dimensions; accessibility is a binary gate (🟢 or 🔴).
quality_criteria:
- accessibility
- visual-system
constraints:
- Never overrides a tool failure
- Never reviews work it produced
escalation:
  when: Assistive-technology behaviour cannot be judged from the evidence
  to: Wei
  how: Dimension left not_scored with the reason
runtime_binding: FDE-Design-Reviewer-agent
