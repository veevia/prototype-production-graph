id: design-quality
name: Design quality (judged from screenshots)
reviewer: product-ux-critic
scale: "review dimensions 1–5 (4 = meets Wei's bar); human dimensions decided by a named human"
dimensions:
  - {id: DES-HIERARCHY, name: "Clear hierarchy: one focal point and one primary action per screen", brief_dimension: "usability and clarity", level: MUST, check: {type: review}, threshold: "score ≥ 4", rule: R-VIS-007, cases: {never: ["three equal-weight primary buttons", "a KPI wall with no focal point"], always: ["the decision the user came for is the most prominent thing"]}}
  - {id: DES-SPECIFICITY, name: "Product-specific, not generic", brief_dimension: "content realism", level: MUST, check: {type: review}, threshold: "score ≥ 4", rule: R-FID-006, cases: {never: ["'Item 1', 'Dashboard', stock icons for everything"], always: ["the domain's own nouns, units and edge cases"]}}
  - {id: DES-CONSISTENCY, name: "One component language across screens", brief_dimension: "visual quality and consistency", level: MUST, check: {type: review}, threshold: "score ≥ 4", rule: R-VIS-001, cases: {never: ["two table styles", "three button radii"], always: []}}
  - {id: DES-DENSITY, name: "Density fits the task: tables for comparison and audit", brief_dimension: "usability and clarity", level: MUST, check: {type: review}, threshold: "score ≥ 4", rule: R-VIS-008, cases: {never: ["decorative cards for row-by-row comparison", "many left-accent highlights"], always: ["a two-column comparison above the fold"]}}
  - {id: DES-SEMANTIC-COLOR, name: "Colour carries meaning consistently; never meaning alone", brief_dimension: "visual quality and consistency", level: MUST, check: {type: review}, threshold: "score ≥ 4", rule: R-VIS-005, cases: {never: ["red for decoration"], always: ["icon + text + colour for every status"]}}
  - {id: DES-DERIVATION, name: "Decision-driving values show their derivation", brief_dimension: "usability and clarity", level: MUST, check: {type: review}, threshold: "score ≥ 4", rule: R-UX-001, cases: {never: ["a verdict with no reason"], always: ["'7.9 ≤ 8.0 max → within'"]}}
  - {id: DES-SCOPE-VISIBLE, name: "Unbuilt capability is marked, never faked", brief_dimension: "customer and business relevance", level: MUST, check: {type: review}, threshold: "score ≥ 4", rule: R-SCP-006, cases: {never: ["a Send button that pretends to send"], always: ["'Draft only — sending is out of scope'"]}}
  - {id: DES-DOMAIN, name: "Distinct domains keep their own workflows", brief_dimension: "workflow completeness", level: SHOULD, check: {type: review}, threshold: "score ≥ 4", rule: R-IA-001, cases: {never: ["one merged flow for units with different jobs"], always: ["a shared shell with a switcher"]}}
  - {id: DES-TASTE, name: "Wei's taste: would Wei put this in front of a customer?", brief_dimension: "visual quality and consistency", level: SHOULD, check: {type: human}, threshold: "decided by Wei at N18", rule: R-GOV-003, cases: {never: [], always: []}}
