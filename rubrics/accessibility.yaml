id: accessibility
name: Accessibility
reviewer: accessibility-reviewer
scale: "tool dimensions pass/fail; review dimensions 1–5 (4 = meets the bar)"
dimensions:
  - {id: A11Y-AXE, name: "0 axe violations (WCAG 2.0/2.1/2.2 A and AA)", brief_dimension: "accessibility", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "0 violations on every screen, state and viewport (axe finds ~57% of issues; the rest needs judgement)", rule: R-A11Y-001, cases: {never: [], always: []}}
  - {id: A11Y-FOCUS, name: "Every focused control shows a visible indicator", brief_dimension: "accessibility", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "100% of tab stops sampled show an outline or ring (WCAG 2.4.7)", rule: R-A11Y-003, cases: {never: ["outline: none with no replacement"], always: []}}
  - {id: A11Y-FOCUS-VISIBLE-2411, name: "No focus stop is wholly obscured", brief_dimension: "accessibility", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "0 focus stops wholly obscured after sampling 3 points of each focused element while walking Tab then Shift+Tab on every screen at every planned viewport (WCAG 2.2 SC 2.4.11)", rule: R-A11Y-003, cases: {never: ["a focused link hidden entirely below a sticky header"], always: []}}
  - {id: A11Y-FOCUS-POINTER, name: "A pointer click keeps focus on what was clicked, with no focus ring", brief_dimension: "accessibility", level: SHOULD, check: {type: tool, fn: "browser:check"}, threshold: "at the widest planned width, on up to 3 lists per screen with a current, selected or pressed item: after a click on a resting item, focus is not on a redrawn copy of it put there by script, and no element matches :focus-visible (calibration pending)", rule: R-A11Y-003, cases: {never: ["a list redrawn on selection that refocuses the new row by script, shown with a focus ring in a stakeholder's browser"], always: ["the selection updates the rows in place, so the clicked row keeps its own focus"]}}
  - {id: A11Y-TEXT-SPACING-1412, name: "Text does not clip under WCAG text spacing", brief_dimension: "accessibility", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "0 visible text elements at the widest planned viewport whose scrollHeight or scrollWidth exceeds their client box after applying line-height 1.5, letter-spacing 0.12em, word-spacing 0.16em and p margin-bottom 2em while overflow-x or overflow-y is hidden/clip (WCAG 2.2 SC 1.4.12)", rule: R-A11Y-007, cases: {never: ["fixed-height or line-clamped row titles that cut off after spacing"], always: []}}
  - {id: A11Y-TARGET-AA, name: "Pointer targets ≥ 24 × 24 px", brief_dimension: "accessibility", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "0 interactive elements below 24 × 24 CSS px (WCAG 2.2 SC 2.5.8 AA; inline links exempt)", rule: R-A11Y-005, cases: {never: [], always: []}}
  - {id: A11Y-TARGET-44, name: "Mobile targets ≥ 44 × 44 px", brief_dimension: "responsive behavior", level: SHOULD, check: {type: tool, fn: "browser:check"}, threshold: "0 interactive elements below 44 × 44 at the mobile viewport (WCAG 2.5.5 AAA; case-study rubric H22)", rule: R-A11Y-006, cases: {never: [], always: []}}
  - {id: A11Y-TYPE-MIN, name: "Rendered text ≥ 12 px", brief_dimension: "accessibility", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "0 visible text elements below 12 px (calibration pending)", rule: R-A11Y-007, cases: {never: [], always: []}}
  - {id: A11Y-REDUCED-MOTION, name: "Reduced motion is honoured", brief_dimension: "accessibility", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "no running CSS animation or transition longer than 0.2 s under prefers-reduced-motion: reduce", rule: R-A11Y-009, cases: {never: [], always: []}}
  - {id: A11Y-SEMANTICS, name: "Names, headings and landmarks make sense without sight", brief_dimension: "accessibility", level: MUST, check: {type: review}, threshold: "score ≥ 4", rule: R-A11Y-008, cases: {never: ["a table without headers", "'Click here'"], always: ["one h1 per screen", "status text that says what happened"]}}
  - {id: A11Y-MANUAL, name: "A keyboard and screen-reader walk finds no WCAG A or AA failure", brief_dimension: "accessibility", level: MUST, check: {type: review}, threshold: "score ≥ 4 from a walk with the accessibility-verification skill: every P0 scenario by keyboard alone, focus order and focus restored after dialogs and re-renders (2.4.3), status messages announced (4.1.3), and names automated checks cannot judge", rule: R-A11Y-008, cases: {never: ["focus lost to the page top after a dialog closes", "a result shown but not announced"], always: ["focus returns to the control that opened a dialog", "a status region that says what happened"]}}
