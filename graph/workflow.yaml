    lifecycle_step: Functional, design, and accessibility review
    phase: Build
    stage: Validation
    subgraph: validation
    kind: review
    purpose: Run every planned scenario in a real browser at every viewport, audit accessibility, responsiveness, console, network and performance, then judge visual hierarchy, product specificity and consistency from the screenshots.
    depends_on: [n12_content_data]
    inputs: ["artifact:prototype", "artifact:plan", "state:build.plan", "state:build.prototype", "state:design.system", "state:design.screens", "control:design", "control:experience", "control:evaluation", "rework:self"]
    context: ["Rendered-output inspection finds defects that value checks miss", "Automated accessibility testing finds about 57% of WCAG issues (Deque); the rest needs judgement", "“The design is hard to read” → hierarchy, contrast, typography, spacing, density"]
    state_read: [build.plan, build.prototype, design.system, design.screens]
    state_write: [evaluation.reviews, evaluation.test_results]
    agent: product-ux-critic
    support_agents: [accessibility-reviewer, technical-qa]
    skills: [design-review, accessibility-verification, webapp-testing, prototype-qa, heuristic-evaluation]
    tools: ["Playwright Chromium through pdg.tools.browser:check", "axe-core 4.11.4 (vendored; WCAG 2.0/2.1/2.2 A and AA tags)", "full-page screenshots per screen, state and viewport"]
    instructions: >-
      The tool pre-check has already run the browser suite: read browser-report.json and the screenshots. Score every review
      dimension 1–5 (4 meets the bar) with evidence (the screenshot and the element). For every score below 4, file a finding
      with a severity, the location (screen:viewport), the node it traces to, the smallest fix and an acceptance check. Never
      re-score a tool dimension; a tool failure cannot be overridden. Never review work you produced.
    prompt: prompts/n13_quality_review.md
    outputs:
      - {key: browser_report, kind: json, description: "Tool pre-check: scenarios, axe, overflow, targets, text size, focus, console, network, timing"}
      - {key: screenshots, kind: dir, description: "Screenshots per screen, state and viewport"}
      - {key: quality_review, kind: json, schema: review, description: "The agent's scored review dimensions and findings"}
    completion:
      - {type: artifact, key: browser_report, description: "The browser suite ran and wrote its report"}
      - {type: review_complete, key: quality_review, description: "Every MUST review dimension is scored with evidence"}
    evaluation: [functional, accessibility, responsive, design-quality]
    failure_conditions: ["The browser suite could not run (escalates: Playwright or Chromium unavailable)", "A MUST review dimension left unscored"]
    retry: {max_attempts: 2, behavior: "Re-dispatch with the unscored dimensions; findings are outcomes, not failures"}
    escalation: {after: "2 consecutive failed attempts, or the browser cannot start", to: Wei, report: "The tool error, or the dimensions the reviewer could not judge from the evidence"}
    human_review: {required: false, decision: "Wei's taste dimensions stay pending until N18"}
    provenance: ["browser-report.json and screenshots per build version", "Review record per attempt in evaluation.reviews"]
    controls: {read: [design, experience, evaluation], write: []}
    resources: [browser]
    run: {tool: "browser:check"}

  - id: n14_validation
