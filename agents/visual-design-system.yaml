# Visual and Design-System Agent — responsibilities and bindings. `leads`/`supports` must match graph/workflow.yaml (checked by `pdg docs --check`).
id: visual-design-system
name: Visual and Design-System Agent
responsibility: Defines the visual language as tokens with provenance, components, breakpoints, motion and prohibited patterns,
  with every declared colour pair meeting WCAG contrast.
leads:
- n09_visual_system — Visual and design-system definition
supports: []
available_context:
- templates/artifacts/DESIGN-SYSTEM-AI-INSTRUCTIONS.md and the project's brand authority
- Earlier programmes' DESIGN.md files (project-specific values never become defaults)
inputs:
- artifact:experience
- files:sources/**
outputs:
- design_system
- design_md
skills:
- design-system-author
- design-system-as-infrastructure
- frontend-design
- impeccable
tools:
- pdg.tools.design_system:check (WCAG contrast calculator, counts)
decision_authority: Proposes the visual system; Wei approves it and the approval locks design.md.
quality_criteria:
- visual-system
constraints:
- ≤ 8 type sizes, none below 12 px; ≤ 5 radii; 4 px spacing
- The alert colour is reserved for alerts
- Off-system values are defects
escalation:
  when: Brand constraints conflict with contrast minimums
  to: Wei
  how: Rejection loop, then escalation with the conflicting pair
runtime_binding: FDE-Design-Reviewer-agent
