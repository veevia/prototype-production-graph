id: functional
name: Functional behaviour in a real browser
reviewer: technical-qa
scale: "tool dimensions pass/fail"
dimensions:
  - {id: FUNC-SCENARIOS, name: "Every planned scenario passes end to end", brief_dimension: "functional correctness", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "100% of scenarios pass at every planned viewport, and no screen or state shows any of the plan's `forbidden_text`", rule: R-FUN-001, cases: {never: ["a polished screen whose primary button does nothing"], always: []}}
  - {id: FUNC-STATES, name: "Every planned state renders, holds still, and lets the user out; every screen route shows its screen", brief_dimension: "interaction and state behavior", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "100% of planned states render their marker and, for one second with focus on their first control, keep that focus, insert at most one live region and add or remove at most 10 elements (a busy state is exempt from the count); a state with `recover` is gone from its screen once its control is pressed; each screen's route shows its [data-screen] in a fresh session", rule: R-UX-002, cases: {never: ["a state panel rebuilt four times a second", "a Clear filters button with no handler"], always: []}}
  - {id: VIS-TOKENS-RUNTIME, name: "Every design token the build uses resolves at runtime to its design-system value", brief_dimension: "visual quality and consistency", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "0 custom properties used without a fallback (in rules that apply) that are undefined, and not declared empty on purpose, on an element or pseudo-element using them, on every screen and state; every design-system colour token the page defines computes to its design-system value; every stylesheet read", rule: R-VIS-002, cases: {never: ["--red-ink: var(--red-ink)", "a button whose fill token is undefined, so it renders transparent"], always: ["background: var(--color-primary) with --color-primary defined at :root"]}}
  - {id: VIS-STATE-FILLS, name: "Interactive states stay off the status colours and never repaint a status mark", brief_dimension: "visual quality and consistency", level: SHOULD, check: {type: tool, fn: "browser:check"}, threshold: "on every screen at the widest planned width, in every list with an item marked current, selected or pressed: that item and a hovered item take no status colour (the design system's, by name or role, or a fill that varies across the list's marks); every status mark keeps its colour when its item is current or hovered; a hovered item reads no heavier against its surface than the current one (calibration pending)", rule: R-VIS-005, cases: {never: ["the chosen row in the worst band's alert fill", "the chosen row's score box turned white, so its band vanished", "hover in the lowest band's grey"], always: ["the chosen row marked by the design system's 'where you are' bar on a light fill"]}}
  - {id: REF-PARITY, name: "A refresh keeps what its reference build does", brief_dimension: "visual quality and consistency", level: SHOULD, check: {type: tool, fn: "browser:check"}, threshold: "when pdg.project.yaml declares a reference build: on every screen at the narrowest and widest planned width, the page title within 1 px and the same weight and no more lines, the median control height within 4 px, the reference's search and filter controls present, and the same table mode; each unexplained drift is listed with both values, and an intended one is listed in `reference.expected` with its reason (calibration pending)", rule: R-SCP-001, cases: {never: ["a merge that drops the header search", "a stylesheet leak that resizes titles"], always: []}}
  - {id: FUNC-CONSOLE, name: "No console errors or uncaught exceptions", brief_dimension: "performance and reliability", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "0 console errors and 0 page errors across all runs", rule: R-TEC-005, cases: {never: [], always: []}}
  - {id: FUNC-OFFLINE, name: "No network requests outside the prototype", brief_dimension: "performance and reliability", level: MUST, check: {type: tool, fn: "browser:check"}, threshold: "0 requests other than file:// and data:", rule: R-TEC-002, cases: {never: [], always: []}}
  - {id: PERF-LOAD, name: "Interactive quickly from disk", brief_dimension: "performance and reliability", level: SHOULD, check: {type: tool, fn: "browser:check"}, threshold: "DOMContentLoaded ≤ 1500 ms locally (calibration pending)", rule: R-TEC-006, cases: {never: [], always: []}}
