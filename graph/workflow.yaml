  # ------------------------------------------------------------------------------------------------------- iteration
  - id: n16_feedback_diagnosis
    num: 16
    name: Feedback diagnosis
    lifecycle_step: Feedback diagnosis
    phase: Learn
    stage: Iteration
    subgraph: iteration
    kind: gate
    purpose: Turn every blocking finding and every open piece of feedback into a traced defect — the requirement, design decision, node or implementation it comes from, the smallest effective fix and an acceptance check — then gate the version pass, rework or blocked.
    depends_on: [n13_quality_review, n14_validation, n15_feasibility_review]
    inputs: ["state:evaluation.reviews", "state:evaluation.feedback", "state:evaluation.defects", "feedback:open", "defects:open", "artifact:browser_report", "artifact:quality_review", "artifact:validation_review", "artifact:feasibility_review", "control:evaluation", "rework:self"]
    context: ["The seven-step failure procedure: identify, trace, smallest fix, re-run only what is affected, compare, record, escalate", "Tool findings arrive pre-traced; confirm or re-trace them", "Stakeholder feedback scopes a targeted fix, not a full redesign"]
    state_read: [evaluation.reviews, evaluation.feedback, evaluation.defects]
    state_write: [evaluation.defects, evaluation.feedback, evaluation.gates, evaluation.comparisons]
    agent: orchestrator
    support_agents: [product-ux-critic, technical-qa]
    skills: [debugging-and-error-recovery, five-whys, fishbone-diagram, traffic-light-decisions, rose-bud-thorn]
    tools: ["pdg.tools.diagnosis:gate (tri-state gate and before/after comparison)"]
    instructions: >-
      For every blocking agent or human finding and every open feedback item, write a defect: a stable signature
      (dimension@location), the severity, the evidence, the node it traces to and why (trace_reason), the smallest fix and
      an acceptance check. Blocking tool findings are mapped automatically from their own trace; re-trace one only with a
      reason. Map every feedback item to defects or dismiss it with a reason. Trace to the earliest node whose output is
      wrong, not to the last node that touched it. The deterministic gate then decides: pass (nothing blocking), rework
      (routable defects and budget left) or blocked (needs Wei: a locked document, an unroutable trace, a defect that failed
      3 corrections, or the cycle budget spent).
    prompt: prompts/n16_feedback_diagnosis.md
    outputs:
      - {key: interpretation, kind: json, schema: interpretation, description: "Traced defects and the feedback mapping"}
      - {key: gate_report, kind: json, description: "Hook output: gate outcome, reasons, blocking defects, targets, comparison"}
    completion:
      - {type: artifact, key: interpretation, description: "The interpretation validates against its schema"}
      - {type: interpretation_complete, description: "Every open feedback item and blocking agent/human finding is mapped; every defect has a known trace, a smallest fix and an acceptance check"}
    evaluation: [gate]
    failure_conditions: ["An unmapped feedback item", "A blocking finding without a defect", "A defect traced to an unknown node or without a fix"]
    retry: {max_attempts: 3, behavior: "Re-dispatch with the unmapped findings and feedback listed"}
    escalation: {after: "Gate outcome blocked, or 3 consecutive failed attempts", to: Wei, report: "Open defects, their traces, what was tried in each cycle, and what unblocks the run"}
    human_review: {required: false, decision: "Blocked gates escalate to Wei"}
    provenance: ["Gate result per cycle in evaluation.gates", "Before/after comparison per rework cycle", "Ledger: gate, regeneration_plan"]
    controls: {read: [evaluation], write: []}
    outcomes: [pass, rework, blocked]
    run: {tool: "diagnosis:gate"}
    gate: review_gate

  - id: n17_targeted_rework
    num: 17
    name: Targeted redesign or redevelopment
    lifecycle_step: Targeted redesign or redevelopment
    phase: Build
    stage: Iteration
    subgraph: iteration
    kind: tool
    purpose: Plan the smallest correction — re-open only the nodes the defects trace to (a design node for redesign, a build node for redevelopment), snapshot their outputs for the before/after comparison, and hand each target its defects.
    depends_on: [n16_feedback_diagnosis]
    inputs: ["state:evaluation.gates", "state:evaluation.defects", "artifact:gate_report", "rework:self"]
    context: ["Minimal regeneration: fingerprints skip unaffected work", "Change only what the defect needs; never restart the whole project to fix one defect"]
    state_read: [evaluation.gates, evaluation.defects]
    state_write: [evaluation.defects, history.revisions]
    agent: orchestrator
    skills: [debugging-and-error-recovery, code-simplification, drift-check, design-decision-articulator, traffic-light-decisions]
    tools: ["pdg.tools.regen:plan", "pdg.tools.regen:check_targeted"]
    instructions: >-
      Deterministic. Build the regeneration plan from the gate: the target nodes (only regeneration targets), the defects per
      target with their smallest fix and acceptance check, and a snapshot of each target's current output hashes. The engine
      then fires one `target:<node>` loop edge per target, invalidating the target and its flow descendants; unchanged
      fingerprints are memo-skipped. A plan with no target escalates.
    prompt: prompts/n17_targeted_rework.md
    outputs:
      - {key: regeneration_plan, kind: json, description: "Targets, defects per target, before-snapshot"}
    completion:
      - {type: artifact, key: regeneration_plan, description: "The regeneration plan was written"}
      - {type: tool, fn: "regen:check_targeted", description: "Every target is a regeneration target traced by an open defect; no untraced node is re-opened"}
    evaluation: [regeneration]
    failure_conditions: ["A target no defect traces to", "A target outside the regeneration targets"]
    retry: {max_attempts: 2, behavior: "Tool errors only"}
    escalation: {after: "No routable target (E40), or a loop edge's traversal budget spent", to: Wei, report: "The defects that could not be routed and the rework history"}
    human_review: {required: false, decision: "Not required"}
    provenance: ["regeneration-plan.json per cycle", "Ledger: regeneration_plan, invalidated", "history.revisions per target"]
    controls: {read: [], write: []}
    outcomes: [rework, no_target]
    run: {tool: "regen:plan"}
    gate: regeneration_plan

  # -------------------------------------------------------------------------------------------------------- delivery
  - id: n18_final_verification
    num: 18
    name: Final verification and delivery
    lifecycle_step: Final verification and delivery
    phase: Build
    stage: Validation
    subgraph: delivery
    kind: tool
    purpose: Recompute every release condition from disk, package the prototype with its evidence and a hashed manifest, list every human dimension still pending, and ask Wei to release or request changes.
    depends_on: [n16_feedback_diagnosis]
    inputs: ["state:evaluation.gates", "state:evaluation.defects", "state:evaluation.reviews", "state:build.prototype", "state:history.approvals", "artifact:prototype", "artifact:gate_report", "control:product", "control:evaluation", "rework:self"]
    context: ["A technical pass is not a release: Wei decides", "Dry-run approvals are labelled not human in the package", "Simulated validation is listed as simulated, never as user evidence"]
    state_read: [evaluation.gates, evaluation.defects, evaluation.reviews, build.prototype, history.approvals]
    state_write: [history.decisions, history.versions]
    agent: technical-qa
    support_agents: [orchestrator]
    skills: [shipping-and-launch, prototype-review, traffic-light-decisions, extreme-clarity, documentation-and-adrs]
    tools: ["pdg.tools.release:verify (recompute conditions, verify the ledger, package with sha256 manifest)"]
    instructions: >-
      Deterministic. Verify the latest gate passed on the current build version, that no blocking defect is open and that every
      review is current; re-hash the prototype, verify the ledger, and package the prototype, the control documents, the
      reviews, the gate history, the comparisons and the approvals with a sha256 manifest. The release summary leads with a
      TL;DR and lists pending human dimensions and non-human approvals. Wei releases the version or requests changes with
      feedback, which loops back to diagnosis (E42).
    prompt: prompts/n18_final_verification.md
    outputs:
      - {key: release_report, kind: json, description: "Every release condition with its evidence"}
      - {key: release_summary, kind: markdown, description: "TL;DR, conditions, pending human dimensions, non-human approvals"}
      - {key: package, kind: dir, description: "Prototype, control documents and evidence with a sha256 manifest"}
    completion:
      - {type: artifact, key: release_report, description: "The release report was written"}
      - {type: artifact, key: package, description: "The package directory was registered"}
    evaluation: [release]
    failure_conditions: ["A release condition fails on recompute", "A manifest hash mismatch", "The ledger fails verification"]
    retry: {max_attempts: 2, behavior: "Tool errors only; a failed condition escalates"}
    escalation: {after: "A failed release condition, or 2 change-request loops (E42)", to: Wei, report: "The failing condition with its evidence"}
    human_review: {required: true, decision: "Release this prototype version, or request changes with feedback", approver: Wei, outcomes: [approved, changes_requested]}
    provenance: ["release-report.json and package manifest (sha256 per file)", "Wei's release decision in history.approvals"]
    controls: {read: [product, evaluation], write: []}
    outcomes: [approved, changes_requested]
    run: {tool: "release:verify"}
    gate: release

  - id: n19_learning_memory
    num: 19
    name: Learning and memory update
    lifecycle_step: Learning and memory update
    phase: Learn
    stage: Iteration
    subgraph: delivery
    kind: gate
    purpose: Capture what this run taught — defects, effective corrections, rule observations and Wei's feedback — separate project-specific notes from reusable lessons, and propose rule changes that only a named human can apply.
    depends_on: [n18_final_verification]
    inputs: ["state:evaluation.defects", "state:evaluation.comparisons", "state:evaluation.feedback", "state:knowledge.enforced", "state:history.approvals", "artifact:release_report", "control:memory", "rework:self"]
    context: ["Rule lifecycle: candidate → validated → approved → adopted → monitored → revised | retired", "Evidence before any change to default behaviour", "Learning never edits product truth, requirements, evidence or approved design principles"]
    state_read: [evaluation.defects, evaluation.comparisons, evaluation.feedback, knowledge.enforced]
    state_write: [knowledge.lessons, knowledge.proposal]
    agent: learning-memory
    skills: [rubric-authoring, evidence-tagging, decision-capture, skill-creator, wiki-ingest]
    tools: ["pdg.tools.learning:propose (rule observations and candidates)", "pdg.tools.learning:check_lessons"]
    instructions: >-
      Write lessons, each with a scope (reusable | project_specific), an evidence class (verified | inferred | recommendation |
      missing), its evidence (defect ids, comparisons, feedback ids, ledger events) and, when it observes an existing rule,
      the rule id and whether the rule helped. Update memory.md: project-specific notes stay there. The deterministic hook
      writes learning-proposal.json; the rule base changes only when Wei runs `pdg memory apply`.
    prompt: prompts/n19_learning_memory.md
    outputs:
      - {key: lessons, kind: json, schema: lessons, description: "Lessons classified by scope and evidence", state_fields: {lessons: knowledge.lessons}}
      - {key: memory_md, kind: control, doc: memory, description: "your copy of memory.md, installed into controls/memory.md — project lessons and patterns"}
      - {key: learning_proposal, kind: json, description: "Hook output: rule observations and new candidates, for `pdg memory apply`"}
    completion:
      - {type: artifact, key: lessons, description: "The lessons document validates against its schema"}
      - {type: tool, fn: "learning:check_lessons", description: "Every lesson has evidence and a scope; referenced rules exist; nothing targets a protected scope"}
    evaluation: [learning]
    failure_conditions: ["A lesson without evidence", "A lesson that changes a protected scope", "A reference to an unknown rule"]
    retry: {max_attempts: 2, behavior: "Re-dispatch with the failing lessons"}
    escalation: {after: "2 consecutive failed attempts", to: Wei, report: "The lessons that could not be evidenced"}
    human_review: {required: false, decision: "Rule changes are applied by Wei with `pdg memory apply`"}
    provenance: ["learning-proposal.json", "memory.md versions archived", "rules-changelog.jsonl on apply"]
    controls: {read: [memory], write: [memory]}
    run: {tool: "learning:propose"}
    gate: learning

edges:
  - {id: E01, from: START, to: n01_context_intake, kind: flow, transition: deterministic, when: "*", transfers: ["the brief", "sources/"], threshold: "sources/brief.md exists", behavior: "Opens the run"}
  - {id: E02, from: n01_context_intake, to: n02_evidence_review, kind: flow, transition: deterministic, when: "*", transfers: ["artifact:sources", "state:inputs.sources"], threshold: "Registry schema-valid; every source tagged", behavior: "Forward"}
  - {id: E03, from: n02_evidence_review, to: n01_context_intake, kind: loop, transition: conditional, when: gaps_resolvable, transfers: ["artifact:gaps"], threshold: "At least one resolvable gap", behavior: "Retry intake with the gap list; the inputs stay unfrozen", max_traversals: 2}
  - {id: E04, from: n02_evidence_review, to: n03_problem_definition, kind: flow, transition: conditional, when: pass, transfers: ["artifact:evidence", "state:research.*", "the inputs sha256"], threshold: "No blocking or resolvable gap; inputs frozen", behavior: "Branch: pass"}
  - {id: E05, from: n02_evidence_review, to: "@escalate", kind: escalate, transition: conditional, when: gaps_blocking, transfers: ["artifact:gaps"], threshold: "A blocking gap", behavior: "Escalate to Wei; the run is BLOCKED until a source is registered or the gap is waived"}
  - {id: E06, from: n03_problem_definition, to: n04_requirements, kind: flow, transition: conditional, when: approved, transfers: ["artifact:problem", "state:product.problem"], threshold: "Wei approved the problem frame", behavior: "Approval: forward"}
  - {id: E07, from: n03_problem_definition, to: n03_problem_definition, kind: loop, transition: conditional, when: rejected, transfers: ["Wei's rejection reason"], threshold: "Wei rejected the frame", behavior: "Retry the frame with Wei's reason", max_traversals: 2}
  - {id: E08, from: n04_requirements, to: n05_scope_success, kind: flow, transition: deterministic, when: "*", transfers: ["artifact:requirements", "state:product.requirements"], threshold: "Every requirement traced; every P0 has acceptance criteria", behavior: "Forward"}
  - {id: E09, from: n05_scope_success, to: n06_concept_ideation, kind: flow, transition: conditional, when: approved, transfers: ["artifact:scope", "product.md and evaluation.md (locked)"], threshold: "Wei signed the scope", behavior: "Approval: forward; product.md and evaluation.md lock"}
  - {id: E10, from: n05_scope_success, to: n04_requirements, kind: loop, transition: conditional, when: rejected, transfers: ["Wei's rejection reason"], threshold: "Wei rejected the scope", behavior: "Rollback to requirements with Wei's reason", max_traversals: 2}
  - {id: E11, from: n06_concept_ideation, to: n07_experience_architecture, kind: flow, transition: conditional, when: approved, transfers: ["artifact:concepts", "state:design.selected_concept"], threshold: "Wei chose a concept", behavior: "Approval: forward"}
  - {id: E12, from: n06_concept_ideation, to: n06_concept_ideation, kind: loop, transition: conditional, when: rejected, transfers: ["Wei's rejection reason"], threshold: "Wei rejected every concept", behavior: "Re-ideate with Wei's reason", max_traversals: 2}
  - {id: E13, from: n07_experience_architecture, to: n08_interaction_design, kind: flow, transition: deterministic, when: "*", transfers: ["artifact:experience", "state:design.screens", "state:design.flows"], threshold: "Every P0 requirement covered by a flow", behavior: "Fan-out (1 of 2)"}
  - {id: E14, from: n07_experience_architecture, to: n09_visual_system, kind: flow, transition: deterministic, when: "*", transfers: ["artifact:experience", "state:design.screens"], threshold: "Screen inventory complete", behavior: "Fan-out (2 of 2); runs in parallel with N08"}
  - {id: E15, from: n08_interaction_design, to: n10_prototype_planning, kind: flow, transition: deterministic, when: "*", transfers: ["artifact:interactions", "state:design.interactions"], threshold: "Every screen has states and keyboard behaviour", behavior: "Fan-in (1 of 2): join = all"}
  - {id: E16, from: n09_visual_system, to: n10_prototype_planning, kind: flow, transition: conditional, when: approved, transfers: ["artifact:design_system", "design.md (locked)"], threshold: "Wei approved the visual system", behavior: "Fan-in (2 of 2): join = all; design.md locks"}
  - {id: E17, from: n09_visual_system, to: n09_visual_system, kind: loop, transition: conditional, when: rejected, transfers: ["Wei's rejection reason"], threshold: "Wei rejected the visual system", behavior: "Retry the visual system with Wei's reason", max_traversals: 2}
  - {id: E18, from: n10_prototype_planning, to: n11_prototype_development, kind: flow, transition: conditional, when: approved, transfers: ["artifact:plan", "prototype.md (locked)"], threshold: "Wei approved the fidelity and the plan", behavior: "Approval: forward; prototype.md locks"}
  - {id: E19, from: n10_prototype_planning, to: n10_prototype_planning, kind: loop, transition: conditional, when: rejected, transfers: ["Wei's rejection reason"], threshold: "Wei rejected the plan", behavior: "Replan with Wei's reason (lowering the fidelity is a valid fix)", max_traversals: 2}
  - {id: E20, from: n11_prototype_development, to: n12_content_data, kind: flow, transition: deterministic, when: "*", transfers: ["artifact:prototype_build", "artifact:build_manifest"], threshold: "Static checks and unit tests pass", behavior: "Forward"}
  - {id: E21, from: n12_content_data, to: n13_quality_review, kind: flow, transition: deterministic, when: "*", transfers: ["artifact:prototype (build version N)"], threshold: "Content checks pass", behavior: "Fan-out (1 of 3)"}
  - {id: E22, from: n12_content_data, to: n14_validation, kind: flow, transition: deterministic, when: "*", transfers: ["artifact:prototype (build version N)", "artifact:plan"], threshold: "Content checks pass", behavior: "Fan-out (2 of 3); parallel"}
  - {id: E23, from: n12_content_data, to: n15_feasibility_review, kind: flow, transition: deterministic, when: "*", transfers: ["artifact:prototype", "artifact:prototype_build"], threshold: "Content checks pass", behavior: "Fan-out (3 of 3); parallel"}
  - {id: E24, from: n13_quality_review, to: n16_feedback_diagnosis, kind: flow, transition: deterministic, when: "*", transfers: ["review record", "tool findings"], threshold: "Review complete for build version N", behavior: "Fan-in (1 of 3): join = all"}
  - {id: E25, from: n14_validation, to: n16_feedback_diagnosis, kind: flow, transition: deterministic, when: "*", transfers: ["review record", "validation sessions"], threshold: "Review complete for build version N", behavior: "Fan-in (2 of 3): join = all"}
  - {id: E26, from: n15_feasibility_review, to: n16_feedback_diagnosis, kind: flow, transition: deterministic, when: "*", transfers: ["review record", "feasibility report"], threshold: "Review complete for build version N", behavior: "Fan-in (3 of 3): join = all"}
  - {id: E27, from: n16_feedback_diagnosis, to: n18_final_verification, kind: flow, transition: conditional, when: pass, transfers: ["artifact:gate_report"], threshold: "No blocking defect open; every review current", behavior: "Branch: pass"}
  - {id: E28, from: n16_feedback_diagnosis, to: n17_targeted_rework, kind: flow, transition: conditional, when: rework, transfers: ["artifact:gate_report", "the routable defects"], threshold: "Blocking defects with routable traces and budget left", behavior: "Branch: rework"}
  - {id: E29, from: n16_feedback_diagnosis, to: "@escalate", kind: escalate, transition: conditional, when: blocked, transfers: ["artifact:gate_report", "rework history"], threshold: "A defect needs Wei, failed 3 corrections, or the cycle budget is spent", behavior: "Escalate; the run is BLOCKED"}
  - {id: E30, from: n17_targeted_rework, to: n03_problem_definition, kind: loop, transition: conditional, when: "target:n03_problem_definition", transfers: ["defects traced to the problem frame"], threshold: "An open defect traces here", behavior: "Redesign: re-open the problem frame and its descendants", max_traversals: 4}
  - {id: E31, from: n17_targeted_rework, to: n04_requirements, kind: loop, transition: conditional, when: "target:n04_requirements", transfers: ["defects traced to a requirement"], threshold: "An open defect traces here (product.md is locked: a change request comes first)", behavior: "Redesign: re-open requirements and descendants", max_traversals: 4}
  - {id: E32, from: n17_targeted_rework, to: n05_scope_success, kind: loop, transition: conditional, when: "target:n05_scope_success", transfers: ["defects traced to scope or success criteria"], threshold: "An open defect traces here (locked documents need a change request)", behavior: "Redesign: re-open scope and descendants", max_traversals: 4}
  - {id: E33, from: n17_targeted_rework, to: n06_concept_ideation, kind: loop, transition: conditional, when: "target:n06_concept_ideation", transfers: ["defects traced to the concept"], threshold: "An open defect traces here", behavior: "Redesign: re-open the concept and descendants", max_traversals: 4}
  - {id: E34, from: n17_targeted_rework, to: n07_experience_architecture, kind: loop, transition: conditional, when: "target:n07_experience_architecture", transfers: ["defects traced to flows or IA"], threshold: "An open defect traces here", behavior: "Redesign: re-open the experience architecture and descendants", max_traversals: 4}
  - {id: E35, from: n17_targeted_rework, to: n08_interaction_design, kind: loop, transition: conditional, when: "target:n08_interaction_design", transfers: ["defects traced to interactions or states"], threshold: "An open defect traces here", behavior: "Redesign: re-open the interaction spec and descendants", max_traversals: 4}
  - {id: E36, from: n17_targeted_rework, to: n09_visual_system, kind: loop, transition: conditional, when: "target:n09_visual_system", transfers: ["defects traced to tokens or components"], threshold: "An open defect traces here (design.md is locked: a change request comes first)", behavior: "Redesign: re-open the visual system and descendants", max_traversals: 4}
  - {id: E37, from: n17_targeted_rework, to: n10_prototype_planning, kind: loop, transition: conditional, when: "target:n10_prototype_planning", transfers: ["defects traced to the plan"], threshold: "An open defect traces here (prototype.md is locked: a change request comes first)", behavior: "Replan and re-open descendants", max_traversals: 4}
  - {id: E38, from: n17_targeted_rework, to: n11_prototype_development, kind: loop, transition: conditional, when: "target:n11_prototype_development", transfers: ["defects traced to the implementation"], threshold: "An open defect traces here", behavior: "Redevelopment: re-open the build and descendants", max_traversals: 4}
  - {id: E39, from: n17_targeted_rework, to: n12_content_data, kind: loop, transition: conditional, when: "target:n12_content_data", transfers: ["defects traced to content or data"], threshold: "An open defect traces here", behavior: "Redevelopment: re-open content integration and descendants", max_traversals: 4}
  - {id: E40, from: n17_targeted_rework, to: "@escalate", kind: escalate, transition: conditional, when: no_target, transfers: ["the unroutable defects"], threshold: "No routable target", behavior: "Escalate; the run is BLOCKED"}
  - {id: E41, from: n18_final_verification, to: n19_learning_memory, kind: flow, transition: conditional, when: approved, transfers: ["artifact:release_report", "artifact:package"], threshold: "Wei released the version", behavior: "Approval: forward"}
  - {id: E42, from: n18_final_verification, to: n16_feedback_diagnosis, kind: loop, transition: conditional, when: changes_requested, transfers: ["Wei's feedback, recorded as feedback items"], threshold: "Wei requested changes", behavior: "Rollback to diagnosis: the feedback becomes traced defects", max_traversals: 2}
  - {id: E43, from: n19_learning_memory, to: END, kind: flow, transition: deterministic, when: "*", transfers: ["artifact:lessons", "artifact:learning_proposal"], threshold: "Lessons evidenced", behavior: "Ends the run"}
